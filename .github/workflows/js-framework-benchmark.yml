name: js-framework-benchmark

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "ci/js-framework-benchmark"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watervein-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Watervein benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCHMARK_FRAMEWORKS: "keyed/vanillajs keyed/vanjs keyed/react-hooks keyed/preact-hooks keyed/mikado keyed/vue keyed/solid keyed/svelte keyed/watervein"
    steps:
      - name: Show runner resources
        shell: bash
        run: |
          echo "=== CPU ==="
          lscpu
          echo "=== Logical CPUs ==="
          nproc
          echo "=== Memory ==="
          free -h

      - name: Checkout watervein
        uses: actions/checkout@v4
        with:
          path: watervein
          persist-credentials: false

      - name: Checkout js-framework-benchmark
        uses: actions/checkout@v4
        with:
          repository: waterveinjs/js-framework-benchmark
          ref: 1e4e53d411defc4a02e5842efda9bfe73be8567b
          path: js-framework-benchmark
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: watervein/pnpm-lock.yaml

      - name: Install watervein dependencies
        working-directory: watervein
        run: pnpm install --frozen-lockfile

      - name: Build watervein packages
        working-directory: watervein
        run: pnpm build

      - name: Pack local watervein packages
        working-directory: watervein
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/watervein-packages"
          mkdir -p "$PACK_DIR"
          for package in core dom-core dom; do
            (cd "packages/$package" && pnpm pack --pack-destination "$PACK_DIR")
          done
          echo "WATERVEIN_PACK_DIR=$PACK_DIR" >> "$GITHUB_ENV"

      - name: Install benchmark dependencies against local watervein build
        working-directory: js-framework-benchmark/frameworks/keyed/watervein
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const packagePath = path.resolve("package.json");
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const packDir = process.env.WATERVEIN_PACK_DIR;
          const packages = {
            "@watervein/core": "watervein-core-",
            "@watervein/dom-core": "watervein-dom-core-",
            "@watervein/dom": "watervein-dom-",
          };

          let frameworkVersion;
          for (const [name, prefix] of Object.entries(packages)) {
            const file = fs.readdirSync(packDir).find((entry) =>
              entry.startsWith(prefix) && entry.endsWith(".tgz")
            );
            if (!file) throw new Error(`Missing packed package for ${name}`);
            pkg.dependencies[name] = `file:${path.join(packDir, file)}`;
            if (name === "@watervein/core") {
              frameworkVersion = file.slice(prefix.length, -".tgz".length);
            }
          }

          if (!frameworkVersion) throw new Error("Could not determine the local Watervein version");
          pkg.version = frameworkVersion;
          pkg["js-framework-benchmark"].frameworkVersion = frameworkVersion;

          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install --no-package-lock

      - name: Build Watervein benchmark application
        working-directory: js-framework-benchmark/frameworks/keyed/watervein
        run: npm run build-prod

      - name: Install benchmark root dependencies
        working-directory: js-framework-benchmark
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install benchmark runner, server, and results app dependencies
        working-directory: js-framework-benchmark
        run: |
          npm run install-webdriver-ts
          npm run install-server
          npm run install-webdriver-ts-results

      - name: Start benchmark server
        working-directory: js-framework-benchmark
        shell: bash
        run: |
          npm run start > "$RUNNER_TEMP/js-framework-benchmark-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/js-framework-benchmark-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/ls > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/js-framework-benchmark-server.log"
          exit 1

      - name: Install Playwright Chromium
        working-directory: js-framework-benchmark/webdriver-ts
        run: npx playwright install --with-deps chromium

      - name: Resolve Playwright Chromium executable
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BINARY="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x -print -quit)"
          if [[ -z "$CHROME_BINARY" ]]; then
            echo "Playwright Chromium executable was not found" >&2
            find "$HOME/.cache/ms-playwright" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "CHROME_BINARY=$CHROME_BINARY" >> "$GITHUB_ENV"

      - name: Configure Chromium for GitHub Actions sandbox restrictions
        working-directory: js-framework-benchmark
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const patches = [
            ["webdriver-ts/src/puppeteerAccess.ts", "const args = [", 'const args = [\n    "--no-sandbox",'],
            ["webdriver-ts/src/playwrightAccess.ts", "let args = [", 'let args = [\n    "--no-sandbox",'],
            [
              "webdriver-ts/src/puppeteerAccess.ts",
              "function browserPath(benchmarkOptions: BenchmarkOptions) {",
              "function browserPath(benchmarkOptions: BenchmarkOptions) {\n  if (process.env.CHROME_BINARY) return process.env.CHROME_BINARY;",
            ],
            [
              "webdriver-ts/src/playwrightAccess.ts",
              "function browserPath(benchmarkOptions: BenchmarkOptions) {",
              "function browserPath(benchmarkOptions: BenchmarkOptions) {\n  if (process.env.CHROME_BINARY) return process.env.CHROME_BINARY;",
            ],
            [
              "webdriver-ts/src/isKeyed.ts",
              'main().catch((error) => {\n  console.log("Error in isKeyed", error);\n});',
              'main().catch((error) => {\n  console.error("Error in isKeyed", error);\n  process.exitCode = 1;\n});',
            ],
            [
              "webdriver-ts/src/isCSPCompliant.ts",
              'main().catch((error) => {\n  console.log("Error in isKeyed", error);\n});',
              'main().catch((error) => {\n  console.error("Error in isCSPCompliant", error);\n  process.exitCode = 1;\n});',
            ],
            [
              "webdriver-ts/src/isCSPCompliant.ts",
              '  } finally {\n    await page.goto(`http://${benchmarkOptions.host}:${benchmarkOptions.port}/csp/disable`);\n    await page.close();\n    await browser.close();\n  }',
              '  } finally {\n    try {\n      await page.goto(`http://${benchmarkOptions.host}:${benchmarkOptions.port}/csp/disable`);\n    } finally {\n      try {\n        await page.close();\n      } finally {\n        await browser.close();\n      }\n    }\n  }',
            ],
            [
              "webdriver-ts/src/timeline.ts",
              `  // Find mousedown event. This is the start of the benchmark
              let mousedowns = R.filter(type_eq("mousedown"))(events);
              // Invariant: There must be exactly one click event
              if (mousedowns.length === 0) {
                console.log("no mousedown event", fileName);
              } else if (mousedowns.length == 1) {
                console.log("one mousedown event", fileName);
              } else if (mousedowns.length > 1) {
                console.log("more than one mousedown event", fileName, events);
                throw "at most one mousedown event is expected";
              }

            // Find click event. This is the start of the benchmark. We're using the synthetic "startLogicEvent" event we've created above
            let clicks = R.filter(type_eq("startLogicEvent"))(events);
            // Invariant: There must be exactly one click event
            if (clicks.length !== 1) {
              console.log("exactly one click event is expected", fileName, events);
              throw "exactly one click event is expected";
            }
            let click = clicks[0];

            // check is delay from mousedown to click it unusually long
            if (mousedowns.length>0) {
              let mousedownToClick = click.ts - mousedowns[0].ts;
              if (mousedownToClick>0) {
                console.log("mousedownToClick", mousedownToClick, fileName);
              }
              if (mousedownToClick > 5000) {
                console.log("difference between mousedown and click is unusually long", mousedownToClick, fileName);
                // throw "difference between mousedown and click is unusually long";
              }
            }

          `,
              `  // Find the synthetic event that marks the start of the measured interaction.
            let clicks = R.filter(type_eq("startLogicEvent"))(events);
            if (clicks.length !== 1) {
              console.log("exactly one click event is expected", fileName, events);
              throw "exactly one click event is expected";
            }
            let click = clicks[0];

            // Warmup interactions are recorded in the same trace. Only consider the
            // last mousedown before the measured interaction, not every warmup click.
            let mousedowns = R.filter((e: TimingResult) => e.type === "mousedown" && e.ts <= click.ts)(events);
            let mousedown = mousedowns.at(-1);
            if (mousedown) {
              let mousedownToClick = click.ts - mousedown.ts;
              if (mousedownToClick > 0) {
                console.log("mousedownToClick", mousedownToClick, fileName);
              }
              if (mousedownToClick > 5000) {
                console.log("difference between mousedown and click is unusually long", mousedownToClick, fileName);
              }
            }

          `,
            ],
          ];

          for (const [file, before, after] of patches) {
            const source = fs.readFileSync(file, "utf8");
            if (source.includes(after)) continue;
            if (!source.includes(before)) throw new Error(`Expected patch target not found in ${file}`);
            fs.writeFileSync(file, source.replace(before, after));
          }
          NODE
          npm run compile-webdriver-ts

      - name: Build comparison framework implementations
        working-directory: js-framework-benchmark
        shell: bash
        run: |
          set -euo pipefail
          read -r -a FRAMEWORKS <<< "$BENCHMARK_FRAMEWORKS"
          FILTERED=()
          for framework in "${FRAMEWORKS[@]}"; do
            if [[ "$framework" != "keyed/watervein" ]]; then FILTERED+=("$framework"); fi
          done
          node --input-type=module <<'NODE'
          import { rebuildFrameworks } from "./cli/rebuild-build-single.js";

          const frameworks = process.env.BENCHMARK_FRAMEWORKS
            .split(/\s+/)
            .filter((framework) => framework && framework !== "keyed/watervein");
          if (!rebuildFrameworks(frameworks, true)) {
            process.exitCode = 1;
          }
          NODE

      - name: Run comparison benchmark smoke checks
        working-directory: js-framework-benchmark
        shell: bash
        run: |
          set -euo pipefail
          read -r -a FRAMEWORKS <<< "$BENCHMARK_FRAMEWORKS"
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run bench -- --runner playwright --headless false --chromeBinary "$CHROME_BINARY" --smoketest true "${FRAMEWORKS[@]}"
          xvfb-run -a -s "-screen 0 1920x1080x24" npm --prefix webdriver-ts run isKeyed -- --headless false --chromeBinary "$CHROME_BINARY" "${FRAMEWORKS[@]}"
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run checkCSP -- --headless false --chromeBinary "$CHROME_BINARY" "${FRAMEWORKS[@]}"

      - name: Run framework comparison benchmarks
        working-directory: js-framework-benchmark
        shell: bash
        run: |
          set -euo pipefail
          rm -rf webdriver-ts/results
          mkdir -p webdriver-ts/results
          read -r -a FRAMEWORKS <<< "$BENCHMARK_FRAMEWORKS"
          xvfb-run -a -s "-screen 0 1920x1080x24" npm run bench -- --runner playwright --headless false --chromeBinary "$CHROME_BINARY" "${FRAMEWORKS[@]}"

      - name: Generate standard js-framework-benchmark results table
        if: always()
        working-directory: js-framework-benchmark
        run: npm run results

      - name: Upload standard comparison table and raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watervein-framework-comparison-${{ github.sha }}
          path: |
            js-framework-benchmark/webdriver-ts-results/dist/
            js-framework-benchmark/webdriver-ts/results.json
            js-framework-benchmark/webdriver-ts/results/
            ${{ runner.temp }}/js-framework-benchmark-server.log
          if-no-files-found: warn
          retention-days: 30
