name: PBT

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.10.3'
        cabal-version: 'latest'

    - name: Install Haskell Dependencies
      run: |
        cabal update
        cabal install --lib aeson QuickCheck process containers bytestring --package-env .

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install Node dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Run dowse:s:loop
      run: pnpm dowse:s:loop

    - name: Run dowse:ddg:loop
      run: pnpm dowse:ddg:loop